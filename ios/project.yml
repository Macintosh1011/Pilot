name: BoothPilot
options:
  bundleIdPrefix: dev.parkt
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true

packages:
  convex-swift:
    url: https://github.com/get-convex/convex-swift
    from: "0.8.1"
  Vapi:
    url: https://github.com/VapiAI/ios
    branch: main

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "2" # iPad only
    GENERATE_INFOPLIST_FILE: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

targets:
  BoothPilot:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: BoothPilot
    dependencies:
      - package: convex-swift
        product: ConvexMobile
      - package: Vapi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.parkt.boothpilot
        CODE_SIGN_STYLE: Automatic
    info:
      path: BoothPilot/Info.plist
      properties:
        CFBundleDisplayName: BoothPilot
        CFBundleName: BoothPilot
        # Backend wiring (non-secret; overridable per-device via `defaults write dev.parkt.boothpilot <key> …`)
        BoothConvexURL: https://jovial-wildebeest-931.convex.cloud
        BoothDashboardURL: https://localhost:3000   # point at the DEPLOYED dashboard for an off-device scannable badge QR
        BoothDeviceId: ipad-1
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: false
        ITSAppUsesNonExemptEncryption: false
        UIAppFonts:
          - Newsreader-Variable.ttf
          - Newsreader-Italic.ttf
          - JetBrainsMono-Variable.ttf
        NSMicrophoneUsageDescription: "BoothPilot uses the microphone so you can have a conversation with the booth."
        NSCameraUsageDescription: "BoothPilot uses the camera to scan your LinkedIn QR code."
        # Booth runs on the iPad in landscape on a stand — lock it.
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
